services:
  api:
    build: .
    container_name: visionguard-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - INSPECTION_DB_PATH=/app/data/inspections.db
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  dashboard:
    build: .
    container_name: visionguard-dashboard
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - VISIONGUARD_API_URL=http://api:8000
    volumes:
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
