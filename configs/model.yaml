# VisionGuard AI - Centralized Model & Decision Calibration Configuration

data:
  raw_dir: "data/raw"
  categories:
    - "metal_nut"
    - "screw"
    - "capsule"
  image_size: [256, 256]
  batch_size: 16
  val_split: 0.15
  random_seed: 42

patchcore:
  artifact_root: "models/patchcore"
  input_shape: [256, 256, 3]
  layer_names:
    - "block2b_add"
    - "block3b_add"
  pool_size: 3
  coreset_ratio: 0.10
  n_neighbors: 1
  gaussian_kernel: 5
  gaussian_sigma: 1.0

decision_engine:
  pass_std_multiplier: 2.0
  fail_std_multiplier: 3.5

category_overrides:
  screw:
    image_size: [384, 384]
    input_shape: [384, 384, 3]
    layer_names:
      - "block1a_project_bn"
      - "block2b_add"
    pool_size: 1
    foreground_only: true
    coreset_ratio: 0.25
    pass_std_multiplier: 0.75
    fail_std_multiplier: 2.0
